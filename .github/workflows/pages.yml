# Publishes the website to GitHub Pages for browser testing; native store releases use EAS
# (docs/release.md). Enable Pages for the repository once (Settings → Pages → Source: GitHub
# Actions). It deploys on a push to main, which this repository does not carry yet, and by
# hand, which GitHub offers only once this file is on the default branch.
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs `npm ci`, the type check, the unit tests and the Expo exporter, so it gets
# no more than read: anything in the dependency tree would otherwise hold a token that can
# publish the public site and mint an OIDC identity for this repository.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Nothing after the checkout uses git; without this the job's token is left in
          # .git/config for every later step to read.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The site is served from <user>.github.io/<repository>/, so every address in it carries
      # /<repository> (app.config.js turns WEB_BASE_PATH into experiments.baseUrl), and Pages
      # sends no headers, so the policy reaches the pages as the <meta> scripts/build-web.mjs
      # writes into them. The build writes dist/.
      - name: Build the website for GitHub Pages
        run: npm run build:web
        env:
          WEB_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
