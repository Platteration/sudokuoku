<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#19232d" media="(prefers-color-scheme: dark)" />
    <title>Page not found · Sudokuoku</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Served at whatever address was mistyped, so nothing here is relative: the look is inline,
         in the Classic pack's colours, and the icon and the link are written for the site's base
         path at build time (scripts/build-web.mjs). -->
    <style>
      html {
        background: #f5f0e6;
        color: #24333e;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        padding: 28px 24px;
        border-radius: 16px;
        background: #fffaf0;
        border: 1px solid #b7b2a4;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
        color: #296f69;
      }
      h1 {
        font-size: 1.4rem;
        margin: 12px 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #57676e;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: #296f69;
        color: #fffaf0;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #24333e;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #19232d;
          color: #f7f1e5;
        }
        main {
          background: #24323e;
          border-color: #526674;
        }
        svg {
          color: #88c9c0;
        }
        p {
          color: #b7c2c7;
        }
        a {
          background: #88c9c0;
          color: #19232d;
        }
        a:focus-visible {
          outline-color: #f7f1e5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
      </svg>
      <h1>That page isn’t here</h1>
      <p>The address may be mistyped, or the page may have moved. Sudokuoku is one page: the board, the daily challenge and your progress all live there.</p>
      <a href="/">Open Sudokuoku</a>
    </main>
  </body>
</html>
