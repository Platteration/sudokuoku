# Sudokuoku: nginx configuration for the website. Include this file from the http {} block
# (for example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify and Cloudflare Pages read _headers instead, Apache .htaccess; both are in public/ and
# reach the published folder with the build. The values are the same in all of them
# (src/__tests__/website.test.ts), and public/_headers says why each one is what it is.
#
# This file serves the site from a domain's root. For a sub-path, build with
# WEB_BASE_PATH=/sudokuoku, serve the folder from `location /sudokuoku/ { alias ...; }` and
# give error_page, the internal 404 location and the two regex locations that prefix.

# The bundle and the assets carry a content hash in their names: a year, immutable. Everything
# else keeps its name from build to build and is revalidated on every load.
map $uri $sudokuoku_cache_control {
    default                         "no-cache";
    ~^/(_expo/static|assets)/       "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # The folder `npm run build:web` wrote (dist/), copied to the server. Never a checkout:
    # .git/ holds the whole history.
    root /var/www/sudokuoku;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;
    # content types come from the mime.types that the stock nginx.conf includes in http {}

    # a missing page, and a folder with no index of its own, both show the app's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; }

    # never a dotfile (.htaccess, a .git folder), except the security contact in .well-known
    location ~ /\.(?!well-known/) { return 404; }
    # the hosting configs and Expo's update manifest are not part of the site, nor are the
    # repository's own files if a checkout is ever served by mistake
    location ~ ^/(_headers|_redirects|metadata\.json|README\.md|deploy(/.*)?)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), clipboard-read=(self), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $sudokuoku_cache_control always;
}
