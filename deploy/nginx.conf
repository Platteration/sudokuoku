# Sudokuoku: nginx configuration for the website. Include this file from the http {} block
# (for example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify and Cloudflare Pages read _headers instead, Apache .htaccess; both are in public/ and
# reach the published folder with the build. The values are the same in all of them
# (src/__tests__/website.test.ts), and public/_headers says why each one is what it is.
#
# This file serves the site from a domain's root. For a sub-path, build with
# WEB_BASE_PATH=/sudokuoku, set root to the folder that holds the published folder under that
# name (/var/www, holding /var/www/sudokuoku/), and put /sudokuoku in front of the error page,
# the internal 404 location, every location below and the map's pattern.
#
# Needs nginx 1.25.1 or later for `http2 on;` (Debian 12 ships 1.22, Ubuntu 24.04 1.24). On an
# older nginx, delete that line and write `listen 443 ssl http2;` and `listen [::]:443 ssl http2;`
# instead, which later versions still accept, with a warning that the form is deprecated.

# The bundle and the assets carry a content hash in their names: a year, immutable. Everything
# else keeps its name from build to build and is revalidated on every load.
map $uri $sudokuoku_cache_control {
    default                         "no-cache";
    ~^/(_expo/static|assets)/       "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 or later (see the top of this file for an older one)
    http2 on;
    server_name example.com;

    # The folder `npm run build:web` wrote (dist/), copied to the server. Never a checkout:
    # .git/ holds the whole history.
    root /var/www/sudokuoku;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;
    # content types come from the mime.types that the stock nginx.conf includes in http {}

    # a missing page, and a folder with no index of its own, both show the app's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; }

    # The site is these addresses and no others: the page, its safety net, the tab icon,
    # robots.txt, the security contact, the bundle and the icon font (each matched by the content
    # hash in its name), and the certificate checks a webroot ACME client writes. Every other
    # address answers 404: the hosting configs and Expo's update manifest, which are in the
    # published folder, folders, and every file of a checkout should one be served by mistake
    # (src/__tests__/website.test.ts walks `git ls-files` through these locations).
    location = / {
        try_files /index.html =404;
    }
    location ~ "^/(index\.html|guard\.js|favicon\.ico|robots\.txt|\.well-known/security\.txt|\.well-known/acme-challenge/[A-Za-z0-9_-]+|_expo/static/js/web/[A-Za-z0-9_-]+-[0-9a-f]{32}\.js|assets/[A-Za-z0-9@/._-]+\.[0-9a-f]{32}\.[a-z0-9]+)$" {
        try_files $uri =404;
    }
    location / {
        return 404;
    }

    # Every add_header is here, at server level, and none is in a location: nginx drops all of
    # the server's from a location that adds one of its own, so a location with so much as a Vary
    # would serve its files with no policy, no nosniff, no HSTS and no Cache-Control.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), aria-notify=(), attribution-reporting=(), autoplay=(), browsing-topics=(), camera=(), captured-surface-control=(), clipboard-read=(self), clipboard-write=(self), compute-pressure=(), cross-origin-isolated=(), deferred-fetch=(), deferred-fetch-minimal=(), digital-credentials-get=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), interest-cohort=(), join-ad-interest-group=(), keyboard-map=(), language-detector=(), local-fonts=(), local-network-access=(), magnetometer=(), microphone=(), midi=(), on-device-speech-recognition=(), otp-credentials=(), payment=(), picture-in-picture=(), private-aggregation=(), private-state-token-issuance=(), private-state-token-redemption=(), publickey-credentials-create=(), publickey-credentials-get=(), run-ad-auction=(), screen-wake-lock=(), serial=(), shared-storage=(), shared-storage-select-url=(), storage-access=(), summarizer=(), sync-xhr=(), translator=(), unload=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $sudokuoku_cache_control always;
}
